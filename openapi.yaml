openapi: 3.0.3
info:
  title: Hebelwerk
  version: 0.1.0
  description: >-
    Delivery ledger for a national AI strategy owned jointly by several ministries.
    Measures carry a named lead ministry, a commitment strength and a delivery
    instrument; money carries a provenance class and a per-year authorisation state;
    the doubling promise resolves into leverage statements computed only from confirmed
    co-financing. Counting definitions are versioned, spillover assessments carry
    response clocks, and portfolio reorganisation re-owns measures without erasing the
    prior assignment.
  x-product-slug: ai-gov-hebelwerk
  x-source: ai-in-gov/Nationale_KI-Strategie_engl/
servers:
  - url: https://api.example.com
tags:
  - name: Register
    description: Strategy editions, fields of action, and measures
  - name: Ownership
    description: Lead ministry assignment and commitment classification
  - name: Money
    description: Funding lines, provenance classes, and appropriation years
  - name: Leverage
    description: Co-financing pledges, realisation, and leverage statements
  - name: Targets
    description: Countable targets and versioned counting definitions
  - name: Delivery
    description: Milestones and declared slippage
  - name: Coordination
    description: Cross-portfolio spillover assessments and response duties
  - name: Continuity
    description: Portfolio reorganisation, re-ownership, and basis lapse
  - name: Scrutiny
    description: Parliamentary, audit, and transparency requests and answers
  - name: Reporting
    description: Coordination report and public delivery extract
paths:
  /v1/strategy-editions:
    get:
      operationId: listStrategyEditions
      tags: [Register]
      summary: List strategy editions under management
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Strategy editions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeStrategyEdition"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createStrategyEdition
      tags: [Register]
      summary: Register a strategy edition with its co-authoring ministries
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyEditionCreate"
      responses:
        "201":
          description: Strategy edition registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStrategyEdition"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/fields-of-action:
    get:
      operationId: listFieldsOfAction
      tags: [Register]
      summary: List fields of action for an edition
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: strategyEditionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Fields of action page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeFieldOfAction"
    post:
      operationId: createFieldOfAction
      tags: [Register]
      summary: Register a field of action
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldOfActionCreate"
      responses:
        "201":
          description: Field of action registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFieldOfAction"
  /v1/measures:
    get:
      operationId: listMeasures
      tags: [Register]
      summary: List measures with ownership and commitment classification
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: fieldOfActionId
          in: query
          schema:
            type: string
        - name: leadMinistryId
          in: query
          schema:
            type: string
        - name: commitmentStrength
          in: query
          schema:
            $ref: "#/components/schemas/CommitmentStrength"
        - name: deliveryInstrument
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryInstrument"
        - name: unowned
          in: query
          description: Return only measures with no current lead assignment
          schema:
            type: boolean
      responses:
        "200":
          description: Measures page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeMeasure"
    post:
      operationId: registerMeasure
      tags: [Register]
      summary: Register a measure taken from the strategy text
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasureCreate"
      responses:
        "201":
          description: Measure registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMeasure"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/measures/{measureId}:
    parameters:
      - $ref: "#/components/parameters/MeasureId"
    get:
      operationId: getMeasure
      tags: [Register]
      summary: Retrieve a measure with its current classification
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Measure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMeasure"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/measures/{measureId}/lead-assignment:
    parameters:
      - $ref: "#/components/parameters/MeasureId"
    put:
      operationId: assignMeasureLead
      tags: [Ownership]
      summary: Assign or replace the accountable lead ministry and unit
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadAssignmentCreate"
      responses:
        "200":
          description: Lead assigned, prior assignment retained in history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeLeadAssignment"
  /v1/measures/{measureId}/classification:
    parameters:
      - $ref: "#/components/parameters/MeasureId"
    post:
      operationId: classifyMeasureCommitment
      tags: [Ownership]
      summary: Set commitment strength, delivery instrument, and subsidiarity level
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commitmentStrength, deliveryInstrument, subsidiarity]
              properties:
                commitmentStrength:
                  $ref: "#/components/schemas/CommitmentStrength"
                deliveryInstrument:
                  $ref: "#/components/schemas/DeliveryInstrument"
                subsidiarity:
                  $ref: "#/components/schemas/SubsidiarityDetermination"
                rationale:
                  type: string
      responses:
        "200":
          description: Classification recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMeasure"
  /v1/measures/{measureId}/funding-lines:
    parameters:
      - $ref: "#/components/parameters/MeasureId"
    get:
      operationId: listFundingLines
      tags: [Money]
      summary: List funding lines attributed to a measure
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: provenance
          in: query
          schema:
            $ref: "#/components/schemas/FundingProvenance"
      responses:
        "200":
          description: Funding lines page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeFundingLine"
    post:
      operationId: attachFundingLine
      tags: [Money]
      summary: Attribute money to a measure with a provenance class
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundingLineCreate"
      responses:
        "201":
          description: Funding line attributed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFundingLine"
        "422":
          description: Rejected because provenance or budget reconciliation is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/funding-lines/{fundingLineId}/appropriation-years/{year}:
    parameters:
      - $ref: "#/components/parameters/FundingLineId"
      - name: year
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: setAppropriationYearState
      tags: [Money]
      summary: Mark a year as planned or authorised against the enacted budget
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppropriationYear"
      responses:
        "200":
          description: Appropriation year state recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAppropriationYear"
  /v1/money/attribution-summary:
    get:
      operationId: getMoneyAttributionSummary
      tags: [Money]
      summary: Attributed money split by provenance class, never as a single total
      security:
        - BearerAuth: []
      parameters:
        - name: strategyEditionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provenance split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMoneyAttributionSummary"
  /v1/measures/{measureId}/cofinancing-pledges:
    parameters:
      - $ref: "#/components/parameters/MeasureId"
    post:
      operationId: recordCoFinancingPledge
      tags: [Leverage]
      summary: Record a pledge from a Land, research organisation, or industry partner
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoFinancingPledgeCreate"
      responses:
        "201":
          description: Pledge recorded as unconfirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCoFinancingPledge"
  /v1/cofinancing-pledges/{pledgeId}/realisation:
    parameters:
      - name: pledgeId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: recordPledgeRealisation
      tags: [Leverage]
      summary: Record contracting or realisation evidence for a pledge
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PledgeRealisationCreate"
      responses:
        "201":
          description: Realisation recorded and confirmed total recalculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePledgeRealisation"
  /v1/leverage-statements:
    get:
      operationId: listLeverageStatements
      tags: [Leverage]
      summary: List issued leverage statements
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Leverage statements page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeLeverageStatement"
    post:
      operationId: issueLeverageStatement
      tags: [Leverage]
      summary: Issue the leverage figure used when the doubling claim is quoted
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeverageStatementCreate"
      responses:
        "201":
          description: Statement issued on confirmed contributions only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeLeverageStatement"
        "409":
          description: Refused because the claim counts unconfirmed pledges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/targets:
    get:
      operationId: listTargetCounters
      tags: [Targets]
      summary: List countable targets and their definition version in force
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: measureId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Targets page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTargetCounter"
    post:
      operationId: createTargetCounter
      tags: [Targets]
      summary: Create a countable target with its first counting definition
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetCounterCreate"
      responses:
        "201":
          description: Target created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTargetCounter"
  /v1/targets/{targetId}/counting-definitions:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: amendCountingDefinition
      tags: [Targets]
      summary: Amend what counts, creating a dated version with a stated reason
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountingDefinitionCreate"
      responses:
        "201":
          description: Definition version created, predecessor retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCountingDefinition"
  /v1/targets/{targetId}/progress-observations:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: recordProgressObservation
      tags: [Targets]
      summary: Record progress stamped with the definition version in force
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressObservationCreate"
      responses:
        "201":
          description: Observation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeProgressObservation"
  /v1/measures/{measureId}/milestones:
    parameters:
      - $ref: "#/components/parameters/MeasureId"
    post:
      operationId: createDeliveryMilestone
      tags: [Delivery]
      summary: Create a milestone typed by the instrument that delivers it
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryMilestoneCreate"
      responses:
        "201":
          description: Milestone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeliveryMilestone"
  /v1/milestones/{milestoneId}/slippage:
    parameters:
      - name: milestoneId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: declareSlippage
      tags: [Delivery]
      summary: Declare slippage with a cause and what is being revised
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlippageDeclarationCreate"
      responses:
        "201":
          description: Slippage declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSlippageDeclaration"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/spillover-assessments:
    get:
      operationId: listSpilloverAssessments
      tags: [Coordination]
      summary: List spillover assessments and their response state
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: affectedMinistryId
          in: query
          schema:
            type: string
        - name: overdueOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Spillover assessments page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSpilloverAssessment"
    post:
      operationId: fileSpilloverAssessment
      tags: [Coordination]
      summary: File a cross-portfolio impact assessment for a measure
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpilloverAssessmentCreate"
      responses:
        "201":
          description: Assessment filed with a response deadline per named ministry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSpilloverAssessment"
  /v1/spillover-assessments/{assessmentId}/responses:
    parameters:
      - name: assessmentId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: respondToSpilloverAssessment
      tags: [Coordination]
      summary: Acknowledge, accept, or dispute an assessment as a named ministry
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoordinationResponseCreate"
      responses:
        "201":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCoordinationResponse"
  /v1/portfolio-reorganisations:
    post:
      operationId: recordPortfolioReorganisation
      tags: [Continuity]
      summary: Record a machinery-of-government change and open a transition window
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioReorganisationCreate"
      responses:
        "201":
          description: Reorganisation recorded with affected measures listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePortfolioReorganisation"
  /v1/measures/{measureId}/basis-lapse:
    parameters:
      - $ref: "#/components/parameters/MeasureId"
    post:
      operationId: markMeasureBasisLapsed
      tags: [Continuity]
      summary: Mark a measure whose political or legal basis has expired
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lapsedBasis, effectiveFrom]
              properties:
                lapsedBasis:
                  type: string
                  enum:
                    - coalition_provision_ended
                    - framework_agreement_expired
                    - programme_closed
                    - reorganisation_without_successor
                    - superseded_by_new_edition
                narrative:
                  type: string
                effectiveFrom:
                  type: string
                  format: date
      responses:
        "200":
          description: Measure marked basis-lapsed with attributed money retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMeasure"
  /v1/scrutiny-requests:
    get:
      operationId: listScrutinyRequests
      tags: [Scrutiny]
      summary: List parliamentary, audit, and transparency requests
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: requestType
          in: query
          schema:
            $ref: "#/components/schemas/ScrutinyRequestType"
      responses:
        "200":
          description: Scrutiny requests page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeScrutinyRequest"
    post:
      operationId: recordScrutinyRequest
      tags: [Scrutiny]
      summary: Record an incoming scrutiny request with its deadline
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrutinyRequestCreate"
      responses:
        "201":
          description: Request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeScrutinyRequest"
  /v1/scrutiny-requests/{scrutinyRequestId}/answer:
    parameters:
      - name: scrutinyRequestId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: answerScrutinyRequest
      tags: [Scrutiny]
      summary: Answer from the ledger with the records relied upon
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRecordCreate"
      responses:
        "201":
          description: Answer recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAnswerRecord"
  /v1/publication-releases:
    post:
      operationId: issuePublicationRelease
      tags: [Reporting]
      summary: Issue the public delivery extract for a period
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationReleaseCreate"
      responses:
        "201":
          description: Release issued from records whose publication state permits it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePublicationRelease"
  /v1/reports/coordination:
    get:
      operationId: getCoordinationReport
      tags: [Reporting]
      summary: Inter-ministerial coordination and delivery report
      security:
        - BearerAuth: []
      parameters:
        - name: strategyEditionId
          in: query
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: true
          schema:
            type: string
            example: 2026-H1
      responses:
        "200":
          description: Coordination report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCoordinationReport"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    MeasureId:
      name: measureId
      in: path
      required: true
      schema:
        type: string
    FundingLineId:
      name: fundingLineId
      in: path
      required: true
      schema:
        type: string
    TargetId:
      name: targetId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: EUR
    PublicationState:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [internal_only, publishable, published]
        withholdingReason:
          type: string
          enum:
            - not_withheld
            - pre_decisional
            - negotiating_position_with_laender
            - third_party_commercial
            - security_sensitive
            - personal_data
        publishedAt:
          type: string
          format: date-time
    CommitmentStrength:
      type: string
      description: How binding the strategy language actually is
      enum:
        - firm
        - conditional
        - advocacy
    DeliveryInstrument:
      type: string
      description: What actually delivers the measure
      enum:
        - federal_expenditure
        - agreement_with_laender
        - negotiation_with_third_party_shareholders
        - private_standardisation_body
        - social_partner_dialogue
        - eu_programme_funding
        - legislative_change
        - administrative_practice
    SubsidiarityDetermination:
      type: string
      enum: [federal, laender, european, shared]
    FundingProvenance:
      type: string
      description: Where the attributed money actually comes from
      enum:
        - newly_appropriated
        - already_in_financial_plan
        - reallocated_within_individual_budget
        - notional_share_of_rd_uplift
        - third_party_cofinancing
    Ministry:
      type: object
      required: [id, name]
      properties:
